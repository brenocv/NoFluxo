# Railway configuration
# This file tells Railway how to build and run the app.
#
# NOTE: this project has both a Dockerfile and Nixpacks config (nixpacks.toml /
# railway.json). Railway uses whichever "Builder" is selected in the service's
# Settings → Build page — check that setting if deploys don't match what you'd
# expect from editing one of these files. Both paths are kept consistent:
# they build with `prisma generate && next build`, then start the app via the
# custom server.ts (Next.js + Socket.IO on the same port), NOT `next start`.

[environments.production]
# No special config needed — Railway auto-detects everything.
