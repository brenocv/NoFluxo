<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist logo: banknote with motion lines suggesting "money flying" -->
  <g>
    <!-- Motion lines (left) -->
    <path d="M8 28 L18 28" stroke="#16a34a" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M6 34 L16 34" stroke="#16a34a" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <path d="M10 22 L18 22" stroke="#16a34a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Banknote (tilted, flying) -->
    <g transform="rotate(-15 36 34)">
      <rect x="20" y="22" width="32" height="24" rx="4" fill="#16a34a"/>
      <rect x="22" y="24" width="28" height="20" rx="2" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
      <circle cx="36" cy="34" r="6" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
      <text x="36" y="38" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">€</text>
    </g>
    
    <!-- Motion lines (right, trailing) -->
    <path d="M48 40 L56 40" stroke="#16a34a" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M50 46 L58 46" stroke="#16a34a" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
